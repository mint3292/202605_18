<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쓱싹쓱싹 청소당번 뽑기 - Premium selector</title>
  <meta name="description" content="1번부터 30번 또는 이름 목록에서 5명의 청소당번을 랜덤으로 공정하게 선발하는 프리미엄 웹앱입니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Confetti Particle Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    
    <!-- Header Section -->
    <header>
      <div class="brand">
        <span class="brand-logo" role="img" aria-label="broom">✨</span>
        <div class="brand-text">
          <h1>쓱싹쓱싹 청소당번 뽑기</h1>
          <p>공정하고 즐거운 청소시간의 시작, 당번 뽑기 시스템</p>
        </div>
      </div>
      <button id="sound-toggle" class="sound-toggle" aria-label="Toggle sound effect">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sound-icon">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span id="sound-status-text">효과음 켜짐</span>
      </button>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="dashboard-grid">
      
      <!-- Left Panel: Controls & Customizations -->
      <section class="glass-card left-panel">
        <h2 class="panel-title">
          <span class="accent-dot"></span>
          설정 및 입력
        </h2>

        <!-- Draw Mode Tabs -->
        <div class="tab-container" role="tablist">
          <button id="tab-number" class="tab-btn active" role="tab" aria-selected="true" aria-controls="control-number-pane">🔢 번호로 뽑기</button>
          <button id="tab-name" class="tab-btn" role="tab" aria-selected="false" aria-controls="control-name-pane">👤 이름으로 뽑기</button>
        </div>

        <!-- Mode 1: Number Settings -->
        <div id="control-number-pane" role="tabpanel">
          <div class="form-group">
            <label for="num-min">시작 번호</label>
            <input type="number" id="num-min" min="1" max="99" value="1">
          </div>
          
          <div class="form-group">
            <label for="num-max">끝 번호</label>
            <input type="number" id="num-max" min="2" max="500" value="30">
          </div>
        </div>

        <!-- Mode 2: Name Settings (Hidden by default) -->
        <div id="control-name-pane" style="display: none;" role="tabpanel">
          <div class="form-group">
            <label for="name-list">이름 목록 (줄바꿈 또는 쉼표로 구분)</label>
            <textarea id="name-list" placeholder="김철수, 이영희, 박민수, 최지우, ...">김철수, 이영희, 박민수, 최수민, 정다은, 강호재, 송하윤, 윤지성, 조아라, 한도윤, 신예진, 유현우, 임채원, 오민재, 권나영, 서준우, 황소희, 안지한, 양수아, 홍승현, 백도현, 남하은, 고유나, 문지호, 심지우, 노정민, 배소연, 곽민우, 전서연, 하은지</textarea>
          </div>
        </div>

        <!-- Common Setting: Number of Winners to draw -->
        <div class="form-group" style="margin-top: 1rem;">
          <label for="draw-count">추첨 인원 (명)</label>
          <input type="number" id="draw-count" min="1" max="100" value="5">
        </div>

        <!-- Session History List -->
        <div class="history-section" style="margin-top: 2rem;">
          <h3 class="panel-title" style="font-size: 1rem; margin-bottom: 0.75rem;">
            <span class="accent-dot" style="background-color: var(--secondary); box-shadow: 0 0 10px var(--secondary);"></span>
            최근 추첨 이력
          </h3>
          <div id="history-list" class="history-list">
            <div class="empty-history">이력이 없습니다.</div>
          </div>
        </div>

      </section>

      <!-- Right Panel: Main Visualization Area -->
      <section class="display-panel">
        
        <!-- Board Visualizer -->
        <div class="glass-card grid-container-wrapper">
          <div id="draw-status" class="draw-status-text"></div>
          
          <!-- Number visualization Grid -->
          <div id="board-container">
            <!-- Grid generated by JS will appear here -->
            <div class="grid-placeholder">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <p>추첨 시작 버튼을 누르면 번호 그리드가 표시되고 당번 선정이 진행됩니다.</p>
            </div>
          </div>
        </div>

        <!-- Large Control Buttons -->
        <div class="action-box">
          <button id="btn-draw" class="btn btn-primary" aria-label="Draw cleanup members">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
            당번 추첨 시작!
          </button>
          <button id="btn-reset" class="btn btn-secondary" aria-label="Reset selection">초기화</button>
        </div>

        <!-- Winner Card Showcase Container -->
        <div id="result-board" class="glass-card result-section" style="display: none;">
          <div class="result-header">
            <h2 class="result-title">
              <span class="crown">👑</span>
              오늘의 청소 당번
            </h2>
            <button id="btn-copy" class="copy-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              결과 복사하기
            </button>
          </div>
          
          <!-- Winner Cards Grid -->
          <div id="winner-cards" class="winner-cards">
            <!-- Dynamically populated winner cards -->
          </div>
        </div>

      </section>

    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 CleanUp Duty Draw system. Designed for perfection and ease of use.</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
